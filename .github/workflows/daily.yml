name: Daily update

on:
  schedule:
    # 05:13 UTC = 05:13 London in winter, 06:13 London in summer.
    - cron: "13 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", "scripts/**", "data/feeds.json", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Test
        run: python tests/test_build.py
      - name: Build today's page
        run: python scripts/build.py
      - name: Save today's edition
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # This run may have checked out an older commit (e.g. it queued behind
          # another run), so put today's edition on top of the latest main
          # rather than pushing from a stale checkout.
          cp data/news.json "$RUNNER_TEMP/news.json"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp "$RUNNER_TEMP/news.json" data/news.json
            git add data/news.json
            if git diff --cached --quiet; then
              echo "No change to today's edition."
              exit 0
            fi
            git commit -m "Daily edition $(date -u +%F)"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt), retrying..."
            sleep $((attempt * 5))
          done
          echo "Could not push today's edition after 3 attempts." >&2
          exit 1
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
